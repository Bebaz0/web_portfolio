# Instalado como /etc/nginx/conf.d/default.conf. HTTP simples: o TLS termina na Cloudflare.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header só é herdado se a location não declarar nenhum add_header próprio.
    # As locations abaixo usam apenas `expires`, por isso estes três chegam a todas as respostas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.html;
    }

    # Nome antigo do CV, para não partir links já partilhados.
    location = /Afonso_Lima_CV.pdf {
        return 301 /Afonso_Araujo_Lima_CV.pdf;
    }

    location = /index.html {
        expires -1;
    }

    # Ficheiros com hash no nome (output do Vite). Um hash antigo dá 404 em vez de index.html com cache de 1 ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
